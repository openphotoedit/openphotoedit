[workspace]
resolver = "2"
members = [
  "crates/editor-core",
  "crates/editor-filters",
  "crates/editor-paint",
  "crates/editor-select",
  "crates/editor-transform",
  "crates/editor-project",
  "crates/editor-psd",
  "crates/editor-ai",
  "crates/editor-wasm",
  "crates/editor-server",
  "crates/editor-raw",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
editor-core = { path = "crates/editor-core" }
editor-filters = { path = "crates/editor-filters" }
editor-paint = { path = "crates/editor-paint" }
editor-select = { path = "crates/editor-select" }
editor-transform = { path = "crates/editor-transform" }
editor-project = { path = "crates/editor-project" }
editor-psd = { path = "crates/editor-psd" }
editor-ai = { path = "crates/editor-ai" }
editor-raw = { path = "crates/editor-raw" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
png = "0.17"
# Pinned exactly: the wasm-bindgen CLI on this machine is 0.2.126 and the two
# refuse to talk when they differ.
wasm-bindgen = "=0.2.126"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
lto = "thin"
opt-level = 3
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 2
