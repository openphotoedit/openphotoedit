# Vendored rawler 0.8.0 (dnglab), LGPL-2.1. Local changes are listed in
# ../README.md. Tests, benches and binaries are not vendored.
[package]
name = "rawler"
version = "0.8.0"
edition = "2024"
rust-version = "1.89"
authors = ["Daniel Vogelbacher <daniel@chaospixel.com>", "Pedro Côrte-Real <pedro@pedrocr.net>"]
description = "A library to extract images and metadata from camera raw formats"
license = "LGPL-2.1"
repository = "https://github.com/dnglab/dnglab"
build = "data/join.rs"
autobins = false
autoexamples = false
autotests = false
autobenches = false
publish = false

[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[features]
inspector = []

[dependencies]
backtrace = "0.3"
bitstream-io = "4.1"
byteorder = "1"
chrono = "0.4"
enumn = "0.1"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
itertools = "0.14"
jxl-oxide = "0.12.2"
lazy_static = "1"
libflate = "2.0"
log = "0.4"
md5 = "0.8"
memmap2 = "0.9.4"
multiversion = "0.8"
num = "0.4"
num_enum = "0.7"
rayon = "1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
uuid = { version = "1.0", features = ["serde", "v4"] }
weezl = "0.1.7"
zerocopy = { version = "0.8.26", features = ["derive"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { version = "1.0", features = ["serde", "v4", "js"] }

[build-dependencies]
glob = "0.3"
rustc_version = "0.4"
toml = "=0.8"
